name: Check LASC Dockets

# This lets you run it two ways:
#   1. Manually — tap the "Run workflow" button in the GitHub app (workflow_dispatch)
#   2. Automatically — every weekday morning (schedule)
on:
  workflow_dispatch:
  schedule:
    # 12:00 UTC = 7:00 AM Central (CDT) / 6:00 AM Central (CST)
    # Runs Monday through Friday
    - cron: '0 12 * * 1-5'

# Allow the workflow to commit the report back to the repo
permissions:
  contents: write

jobs:
  check-dockets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run docket checker
        run: python check_dockets.py

      - name: Commit report
        run: |
          git config user.name "Docket Bot"
          git config user.email "actions@github.com"
          git add docket_report.md
          git commit -m "Docket report $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push
