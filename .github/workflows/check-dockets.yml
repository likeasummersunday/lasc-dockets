name: Check LASC Dockets

on:
  workflow_dispatch:
  schedule:
    # 12:00 UTC = 7:00 AM Central (CDT) / 6:00 AM Central (CST), weekdays
    - cron: '0 12 * * 1-5'

permissions:
  contents: write

jobs:
  check-dockets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run docket checker
        run: python check_dockets.py

      - name: Email report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "LASC Docket Report"
          to: ${{ secrets.MAIL_USERNAME }}
          from: LASC Docket Bot
          body: file://docket_report.md

      - name: Commit report
        run: |
          git config user.name "Docket Bot"
          git config user.email "actions@github.com"
          git add docket_report.md
          git commit -m "Docket report $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push
